<script>

}

];


const map=L.map("map").setView(
[41.3874,2.1630],
14
);


L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"&copy; OpenStreetMap contributors"
}
).addTo(map);


const markerLayer=
L.layerGroup().addTo(map);


function googleMapsLink(location){

return "https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(
location.name+" "+location.address
);

}


function getReviews(id){

try{

return JSON.parse(
localStorage.getItem(
"desiremaps_reviews_"+id
)
)||[];

}catch(e){

return[];

}

}


function getRating(id){

const reviews=getReviews(id);

if(!reviews.length){

return{
average:0,
count:0
};

}

const total=
reviews.reduce(
(sum,r)=>sum+r.rating,
0
);

return{
average:total/reviews.length,
count:reviews.length
};

}


function ratingHTML(id){

const r=getRating(id);

if(!r.count){

return `
<div class="rating-line">
⭐ <strong>No reviews yet</strong><br>
<span style="color:#999">
Be the first to review this place.
</span>
</div>
`;

}

return `
<div class="rating-line">

<span class="rating-stars">
★ ${r.average.toFixed(1)}
</span>

&nbsp; · &nbsp;

💬 ${r.count}
${r.count===1?"Review":"Reviews"}

</div>
`;

}


function markerIcon(icon){

return L.divIcon({

className:"",

html:
'<div class="desire-marker">'+
'<span>'+icon+'</span>'+
'</div>',

iconSize:[38,38],

iconAnchor:[19,38],

popupAnchor:[0,-36]

});

}


function popupHTML(location){

return `

<div class="popup-title">
${location.icon}
${location.name}
</div>

<div class="popup-category">
${location.displayCategory}
</div>

<div class="popup-address">
${location.address}
</div>

${ratingHTML(location.id)}

<div class="popup-buttons">

<button
class="popup-btn review-btn"
onclick="openReview('${location.id}')">
✍️ Write a Review
</button>

<a
class="popup-btn maps-btn"
href="${googleMapsLink(location)}"
target="_blank"
rel="noopener">
📍 Google Maps
</a>

</div>

`;

}


function renderLocations(filter="all"){

markerLayer.clearLayers();

const list=
document.getElementById(
"location-list"
);

list.innerHTML="";


const filtered=
filter==="all"
?
locations
:
locations.filter(
l=>l.category===filter
);


filtered.forEach(location=>{

const marker=L.marker(

[location.lat,location.lng],

{
icon:markerIcon(location.icon)
}

);


marker.bindPopup(
popupHTML(location)
);


marker.addTo(markerLayer);


const rating=
getRating(location.id);


const card=
document.createElement("div");


card.className=
"location-card";


card.innerHTML=`

<div class="location-type">

${location.icon}
${location.displayCategory}

</div>

<h3>
${location.name}
</h3>

<div class="location-address">
${location.address}
</div>

<div class="card-rating">

${
rating.count
?
"⭐ "+
rating.average.toFixed(1)+
" · 💬 "+
rating.count+
" Reviews"
:
"⭐ No reviews yet"
}

</div>

`;


card.onclick=()=>{

map.setView(
[location.lat,location.lng],
16
);

marker.openPopup();

window.scrollTo({
top:
document
.getElementById("map")
.offsetTop-10,

behavior:"smooth"
});

};


list.appendChild(card);

});

}


document
.querySelectorAll(".filter-btn")
.forEach(button=>{

button.onclick=function(){

document
.querySelectorAll(".filter-btn")
.forEach(b=>
b.classList.remove("active")
);

this.classList.add("active");

renderLocations(
this.dataset.filter
);

};

});


let currentReviewLocation=null;

let selectedRating=0;


function openReview(id){

currentReviewLocation=id;

selectedRating=0;


const location=
locations.find(
l=>l.id===id
);


document
.getElementById(
"modal-location"
)
.textContent=
location.name;


document
.getElementById(
"review-text"
)
.value="";


updateStars();


document
.getElementById(
"review-modal"
)
.classList.add("open");

}


function updateStars(){

document
.querySelectorAll(
"#star-picker button"
)
.forEach(button=>{

const rating=
Number(
button.dataset.rating
);

button.classList.toggle(
"selected",
rating<=selectedRating
);

});

}


document
.querySelectorAll(
"#star-picker button"
)
.forEach(button=>{

button.onclick=function(){

selectedRating=
Number(
this.dataset.rating
);

updateStars();

};

});


function closeReview(){

document
.getElementById(
"review-modal"
)
.classList.remove("open");

}


document
.getElementById(
"cancel-review"
)
.onclick=closeReview;


document
.getElementById(
"save-review"
)
.onclick=function(){

if(!selectedRating){

alert(
"Please select a star rating."
);

return;

}


const text=
document
.getElementById(
"review-text"
)
.value
.trim();


const reviews=
getReviews(
currentReviewLocation
);


reviews.push({

rating:selectedRating,

text:text,

date:
new Date().toISOString()

});


localStorage.setItem(

"desiremaps_reviews_"+
currentReviewLocation,

JSON.stringify(reviews)

);


closeReview();


const active=
document.querySelector(
".filter-btn.active"
);


renderLocations(

active
?
active.dataset.filter
:
"all"

);


alert(
"Thank you! Your review has been saved."
);

};


document
.getElementById(
"review-modal"
)
.onclick=function(event){

if(event.target===this){

closeReview();

}

};


renderLocations();


setTimeout(
()=>map.invalidateSize(),
400
);

</script>
