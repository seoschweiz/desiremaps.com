function getReviews(id) {
  try {
    return JSON.parse(
      localStorage.getItem("desiremaps_reviews_" + id)
    ) || [];
  } catch (e) {
    return [];
  }
}

function ratingData(id) {
  const reviews = getReviews(id);

  if (!reviews.length) {
    return {
      count: 0,
      average: 0
    };
  }

  const total = reviews.reduce(
    (sum, review) => sum + review.rating,
    0
  );

  return {
    count: reviews.length,
    average: total / reviews.length
  };
}

function ratingHTML(id) {
  const rating = ratingData(id);

  if (!rating.count) {
    return `
      <div class="rating-box">
        ⭐ <strong>No DesireMaps reviews yet</strong>
      </div>
    `;
  }

  return `
    <div class="rating-box">
      ⭐ <strong>${rating.average.toFixed(1)}</strong>
      &nbsp; · &nbsp;
      💬 ${rating.count}
      ${rating.count === 1 ? "review" : "reviews"}
    </div>
  `;
}

function markerIcon(icon) {
  return L.divIcon({
    className: "",
    html:
      '<div class="desire-marker">' +
      '<span>' + icon + '</span>' +
      '</div>',
    iconSize: [38,38],
    iconAnchor: [19,38],
    popupAnchor: [0,-35]
  });
}

function popupHTML(location) {
  return `
    <div class="popup-title">
      ${location.icon} ${location.name}
    </div>

    <div class="popup-type">
      ${location.type}
    </div>

    <div class="popup-address">
      ${location.address}
    </div>

    ${ratingHTML(location.id)}

    <div class="popup-actions">

      <button class="popup-btn review-btn"
              onclick="openReview('${location.id}')">
        ✍️ Write a Review
      </button>

      <a class="popup-btn maps-btn"
         href="${mapsLink(location)}"
         target="_blank"
         rel="noopener noreferrer">
        📍 Open in Google Maps
      </a>

    </div>
  `;
}

function renderLocations(filter = "all") {

  markerLayer.clearLayers();

  const list = document.getElementById("location-list");

  list.innerHTML = "";

  const filtered =
    filter === "all"
      ? locations
      : locations.filter(
          location => location.category === filter
        );

  document.getElementById("count-line").textContent =
    filtered.length + " locations shown";

  filtered.forEach(location => {

    const marker = L.marker(
      [location.lat, location.lng],
      {
        icon: markerIcon(location.icon)
      }
    );

    marker.bindPopup(
      popupHTML(location)
    );

    marker.addTo(markerLayer);

    const rating = ratingData(location.id);

    const card = document.createElement("div");

    card.className = "location-card";

    card.innerHTML = `
      <div class="location-type">
        ${location.icon} ${location.type}
      </div>

      <h3>${location.name}</h3>

      <div class="location-address">
        ${location.address}
      </div>

      <div class="card-rating">
        ${
          rating.count
            ? "⭐ " +
              rating.average.toFixed(1) +
              " · 💬 " +
              rating.count
            : "⭐ No DesireMaps reviews yet"
        }
      </div>
    `;

    card.addEventListener("click", () => {

      map.setView(
        [location.lat, location.lng],
        16
      );

      marker.openPopup();

      window.scrollTo({
        top: document.getElementById("map").offsetTop - 70,
        behavior: "smooth"
      });

    });

    list.appendChild(card);

  });

}

document
  .querySelectorAll(".filter-btn")
  .forEach(button => {

    button.addEventListener("click", function() {

      document
        .querySelectorAll(".filter-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      this.classList.add("active");

      renderLocations(
        this.dataset.filter
      );

    });

  });

let currentReviewLocation = null;
let selectedRating = 0;

function openReview(id) {

  currentReviewLocation = id;
  selectedRating = 0;

  const location =
    locations.find(item => item.id === id);

  document.getElementById(
    "modal-location"
  ).textContent = location.name;

  document.getElementById(
    "review-text"
  ).value = "";

  updateStars();

  document.getElementById(
    "review-modal"
  ).classList.add("open");
}

function updateStars() {

  document
    .querySelectorAll("#star-picker button")
    .forEach(button => {

      const value =
        Number(button.dataset.rating);

      button.classList.toggle(
        "selected",
        value <= selectedRating
      );

    });

}

document
  .querySelectorAll("#star-picker button")
  .forEach(button => {

    button.addEventListener("click", function() {

      selectedRating =
        Number(this.dataset.rating);

      updateStars();

    });

  });

function closeReview() {

  document
    .getElementById("review-modal")
    .classList.remove("open");

}

document
  .getElementById("cancel-review")
  .addEventListener("click", closeReview);

document
  .getElementById("save-review")
  .addEventListener("click", function() {

    if (!selectedRating) {
      alert("Please choose a star rating.");
      return;
    }

    const reviews =
      getReviews(currentReviewLocation);

    reviews.push({
      rating: selectedRating,
      text:
        document
          .getElementById("review-text")
          .value
          .trim(),
      date: new Date().toISOString()
    });

    localStorage.setItem(
      "desiremaps_reviews_" +
      currentReviewLocation,
      JSON.stringify(reviews)
    );

    closeReview();

    const active =
      document.querySelector(
        ".filter-btn.active"
      );

    renderLocations(
      active
        ? active.dataset.filter
        : "all"
    );

    alert("Your DesireMaps review was saved.");

  });

document
  .getElementById("review-modal")
  .addEventListener("click", function(event) {

    if (event.target === this) {
      closeReview();
    }

  });

renderLocations();

setTimeout(
  () => map.invalidateSize(),
  400
);

</script>

</body>
</html>
