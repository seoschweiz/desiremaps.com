<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Barcelona Desire Map | DesireMaps</title>

  <meta
    name="description"
    content="Discover saunas, massage, bars, clubs, LGBTQ+ nightlife and selected adult venues in Barcelona with DesireMaps."
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #090909;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    header {
      background: #000000;
      border-bottom: 1px solid #242424;
      padding: 18px 20px;
      text-align: center;
    }

    .logo {
      color: #ffffff;
      text-decoration: none;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ff3157;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 14px 50px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: clamp(30px, 7vw, 48px);
    }

    .intro {
      color: #aaaaaa;
      text-align: center;
      max-width: 760px;
      margin: 0 auto 22px;
      line-height: 1.55;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 5px 2px 15px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      border: 1px solid #333333;
      background: #171717;
      color: #ffffff;
      padding: 11px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      touch-action: manipulation;
    }

    .filter-btn.active {
      background: #ff3157;
      border-color: #ff3157;
      color: #ffffff;
    }

    @media (hover: hover) {
      .filter-btn:hover {
        border-color: #ff3157;
      }
    }

    #map {
      width: 100%;
      height: 62vh;
      min-height: 500px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #262626;
      background: #111111;
    }

    .leaflet-container {
      background: #101010;
      font-family: Arial, Helvetica, sans-serif;
    }

    .leaflet-control-zoom a {
      background: #151515 !important;
      color: #ffffff !important;
      border-bottom-color: #333333 !important;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #151515;
      color: #ffffff;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      border: 1px solid #333333;
    }

    .leaflet-popup-content {
      margin: 16px;
      min-width: 220px;
    }

    .popup-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .popup-category {
      color: #ff3157;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: .6px;
      margin-bottom: 8px;
    }

    .popup-address {
      color: #bbbbbb;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .rating-line {
      background: #202020;
      border-radius: 9px;
      padding: 9px 10px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .rating-stars {
      color: #ffd54a;
      font-weight: 900;
    }

    .popup-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .popup-btn {
      text-decoration: none;
      text-align: center;
      padding: 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      border: none;
    }

    .review-btn {
      background: #ff3157;
      color: #ffffff;
    }

    .maps-btn {
      background: #292929;
      color: #ffffff;
      border: 1px solid #3a3a3a;
    }

    .website-btn {
      background: #ffffff;
      color: #000000;
    }

    .desire-marker {
      width: 38px;
      height: 38px;
      background: #ff3157;
      border: 3px solid #ffffff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.55);
    }

    .desire-marker span {
      transform: rotate(45deg);
      font-size: 17px;
      line-height: 1;
    }

    .section-title {
      margin: 32px 0 14px;
      font-size: 24px;
    }

    #location-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .location-card {
      background: #141414;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 16px;
    }

    .location-card h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .location-type {
      color: #ff3157;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .location-address {
      color: #999999;
      font-size: 13px;
      line-height: 1.4;
      margin: 9px 0;
    }

    .card-rating {
      font-size: 13px;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      color: #777777;
      border-top: 1px solid #222222;
      padding: 28px 20px;
      font-size: 13px;
    }

    /* REVIEW MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.82);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      background: #151515;
      border: 1px solid #333333;
      border-radius: 18px;
      padding: 22px;
    }

    .modal-box h2 {
      margin: 0 0 6px;
    }

    .modal-location {
      color: #ff3157;
      margin-bottom: 18px;
      font-weight: 800;
    }

    .star-picker {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }

    .star-picker button {
      background: none;
      border: none;
      color: #555555;
      font-size: 34px;
      padding: 0;
      cursor: pointer;
    }

    .star-picker button.selected {
      color: #ffd54a;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      background: #222222;
      color: #ffffff;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 12px;
      font-family: inherit;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .modal-actions button {
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .cancel-btn {
      background: #292929;
      color: #ffffff;
    }

    .save-btn {
      background: #ff3157;
      color: #ffffff;
    }

    .review-note {
      font-size: 11px;
      color: #777777;
      margin-top: 12px;
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      main {
        padding-left: 10px;
        padding-right: 10px;
      }

      #map {
        min-height: 480px;
        height: 60vh;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="logo" href="/">DESIRE<span>MAPS</span></a>
</header>

<main>

  <h1>Barcelona Desire Map</h1>

  <p class="intro">
    Tap a marker for details or select a category to show only the
    locations you're interested in.
  </p>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="sauna">♨️ Sauna</button>
    <button class="filter-btn" data-filter="massage">💆 Massage</button>
    <button class="filter-btn" data-filter="bar">🍸 Bars</button>
    <button class="filter-btn" data-filter="club">💃 Clubs</button>
    <button class="filter-btn" data-filter="lgbtq">🏳️‍🌈 LGBTQ+</button>
    <button class="filter-btn" data-filter="nightlife">🌙 Nightlife</button>
    <button class="filter-btn" data-filter="adult">🔥 Adult</button>
  </div>

  <div id="map"></div>

  <h2 class="section-title">Places in Barcelona</h2>

  <div id="location-list"></div>

</main>

<footer>
  © DesireMaps.com · Discover Barcelona differently.
</footer>


<div id="review-modal" class="modal">

  <div class="modal-box">

    <h2>Write a Review</h2>

    <div id="modal-location" class="modal-location"></div>

    <div id="star-picker" class="star-picker">
      <button data-rating="1">★</button>
      <button data-rating="2">★</button>
      <button data-rating="3">★</button>
      <button data-rating="4">★</button>
      <button data-rating="5">★</button>
    </div>

    <textarea
      id="review-text"
      placeholder="Tell others about your experience..."
    ></textarea>

    <div class="modal-actions">
      <button id="cancel-review" class="cancel-btn">Cancel</button>
      <button id="save-review" class="save-btn">Save Review</button>
    </div>

    <div class="review-note">
      Test version: reviews are currently stored only in this browser.
    </div>

  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const locations = [

  {
    id: "sauna-casanova",
    name: "Sauna Casanova",
    category: "sauna",
    displayCategory: "Sauna",
    icon: "♨️",
    lat: 41.38485,
    lng: 2.15928,
    address: "Carrer de Casanova 57, Barcelona",
    url: "https://www.google.com/maps/search/?api=1&query=Sauna+Casanova+Barcelona"
  },

  {
    id: "sauna-bruc",
    name: "Sauna Bruc",
    category: "sauna",
    displayCategory: "Sauna",
    icon: "♨️",
    lat: 41.38998,
    lng: 2.17058,
    address: "Carrer de Pau Claris 87, Barcelona",
    url: "https://saunabruc.com/"
  },

  {
    id: "sauna-condal",
    name: "Sauna Condal",
    category: "sauna",
    displayCategory: "Sauna",
    icon: "♨️",
    lat: 41.38627,
    lng: 2.17342,
    address: "Carrer d'Espolsa-sacs 1, Barcelona",
    url: "https://www.google.com/maps/search/?api=1&query=Sauna+Condal+Barcelona"
  },

  {
    id: "thermas",
    name: "Sauna Thermas",
    category: "sauna",
    displayCategory: "Sauna",
    icon: "♨️",
    lat: 41.37915,
    lng: 2.15227,
    address: "Carrer de la Diputació 46, Barcelona",
    url: "https://www.google.com/maps/search/?api=1&query=Sauna+Thermas+Barcelona"
  },

  {
    id: "ambrosia",
    name: "Ambrosia Spa",
    category: "massage",
    displayCategory: "Massage",
    icon: "💆",
    lat: 41.39299,
    lng: 2.16212,
    address: "Passatge Domingo 9, Barcelona",
    url: "https://ambrosiaspabcn.com/"
  },

  {
    id: "priscilla",
    name: "Priscilla Cafè",
    category: "lgbtq",
    displayCategory: "LGBTQ+",
    icon: "🏳️‍🌈",
    lat: 41.38767,
    lng: 2.16096,
    address: "Carrer del Consell de Cent 273, Barcelona",
    url: "https://priscillacafe.com/"
  },

  {
    id: "candy-darling",
    name: "Candy Darling",
    category: "bar",
    displayCategory: "Bar",
    icon: "🍸",
    lat: 41.38504,
    lng: 2.16301,
    address: "Gran Via de les Corts Catalanes 586, Barcelona",
    url: "https://www.google.com/maps/search/?api=1&query=Candy+Darling+Barcelona"
  },

  {
    id: "boys-bar",
    name: "Boys Bar BCN",
    category: "lgbtq",
    displayCategory: "LGBTQ+ Bar",
    icon: "🏳️‍🌈",
    lat: 41.38429,
    lng: 2.15913,
    address: "Carrer de la Diputació 174, Barcelona",
    url: "https://boysbarbcn.com/"
  },

  {
    id: "night-barcelona",
    name: "Night Barcelona",
    category: "nightlife",
    displayCategory: "Nightlife",
    icon: "🌙",
    lat: 41.38430,
    lng: 2.15871,
    address: "Carrer de la Diputació 161, Barcelona",
    url: "https://nightbarcelona.net/"
  },

  {
    id: "believe-club",
    name: "Believe Club",
    category: "club",
    displayCategory: "Club",
    icon: "💃",
    lat: 41.38944,
    lng: 2.16261,
    address: "Carrer de Balmes 56, Barcelona",
    url: "https://thebelieve.club/"
  },

  {
    id: "darling-strip-club",
    name: "Darling Strip Club",
    category: "adult",
    displayCategory: "Adult",
    icon: "🔥",
    lat: 41.38480,
    lng: 2.15910,
    address: "Carrer de Casanova 59, Barcelona",
    url: "https://www.google.com/maps/search/?api=1&query=Darling+Strip+Club+Barcelona"
  }

];


const map = L.map("map").setView(
  [41.3874, 2.1630],
  14
);


const cartoLayer = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {
    maxZoom: 20,
    attribution: "&copy; OpenStreetMap &copy; CARTO"
  }
);

cartoLayer.addTo(map);


const markerLayer = L.layerGroup().addTo(map);


function googleMapsLink(location) {

  const query = encodeURIComponent(
    location.name + " " + location.address
  );

  return "https://www.google.com/maps/search/?api=1&query=" + query;
}


function getReviews(locationId) {

  try {

    return JSON.parse(
      localStorage.getItem(
        "desiremaps_reviews_" + locationId
      )
    ) || [];

  } catch (error) {

    return [];

  }
}


function getRating(locationId) {

  const reviews = getReviews(locationId);

  if (!reviews.length) {

    return {
      average: 0,
      count: 0
    };

  }

  const total = reviews.reduce(
    (sum, review) => sum + review.rating,
    0
  );

  return {
    average: total / reviews.length,
    count: reviews.length
  };
}


function ratingHTML(locationId) {

  const rating = getRating(locationId);

  if (rating.count === 0) {

    return `
      <div class="rating-line">
        ⭐ <strong>No reviews yet</strong><br>
        <span style="color:#999">
          Be the first to review this place.
        </span>
      </div>
    `;

  }

  return `
    <div class="rating-line">
      <span class="rating-stars">★ ${rating.average.toFixed(1)}</span>
      &nbsp; · &nbsp;
      💬 ${rating.count}
      ${rating.count === 1 ? "Review" : "Reviews"}
    </div>
  `;
}


function createMarkerIcon(icon) {

  return L.divIcon({

    className: "",

    html:
      '<div class="desire-marker">' +
      '<span>' + icon + '</span>' +
      '</div>',

    iconSize: [38, 38],

    iconAnchor: [19, 38],

    popupAnchor: [0, -36]

  });

}


function createPopup(location) {

  return `

    <div class="popup-title">
      ${location.icon} ${location.name}
    </div>

    <div class="popup-category">
      ${location.displayCategory}
    </div>

    <div class="popup-address">
      ${location.address}
    </div>

    ${ratingHTML(location.id)}

    <div class="popup-buttons">

      <button
        class="popup-btn review-btn"
        onclick="openReview('${location.id}')"
      >
        ✍️ Write a Review
      </button>

      <a
        class="popup-btn maps-btn"
        href="${googleMapsLink(location)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        📍 Google Maps
      </a>

      <a
        class="popup-btn website-btn"
        href="${location.url}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visit Website
      </a>

    </div>

  `;

}


function renderLocations(filter = "all") {

  markerLayer.clearLayers();

  const list = document.getElementById("location-list");

  list.innerHTML = "";


  const filteredLocations =
    filter === "all"
      ? locations
      : locations.filter(
          location => location.category === filter
        );


  filteredLocations.forEach(location => {

    const marker = L.marker(
      [location.lat, location.lng],
      {
        icon: createMarkerIcon(location.icon)
      }
    );

    marker.bindPopup(
      createPopup(location)
    );

    marker.addTo(markerLayer);


    const rating = getRating(location.id);


    const card = document.createElement("div");

    card.className = "location-card";


    card.innerHTML = `

      <div class="location-type">
        ${location.icon} ${location.displayCategory}
      </div>

      <h3>
        ${location.name}
      </h3>

      <div class="location-address">
        ${location.address}
      </div>

      <div class="card-rating">
        ${
          rating.count
            ? "⭐ " +
              rating.average.toFixed(1) +
              " · 💬 " +
              rating.count +
              " Reviews"
            : "⭐ No reviews yet"
        }
      </div>

    `;


    card.addEventListener("click", () => {

      map.setView(
        [location.lat, location.lng],
        16
      );

      marker.openPopup();

      window.scrollTo({
        top: document.getElementById("map").offsetTop - 15,
        behavior: "smooth"
      });

    });


    list.appendChild(card);

  });


  if (filteredLocations.length === 1) {

    map.setView(
      [
        filteredLocations[0].lat,
        filteredLocations[0].lng
      ],
      16
    );

  }

}


document
  .querySelectorAll(".filter-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      function () {

        document
          .querySelectorAll(".filter-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );


        this.classList.add("active");


        renderLocations(
          this.dataset.filter
        );

      }
    );

  });


let currentReviewLocation = null;
let selectedRating = 0;


function openReview(locationId) {

  currentReviewLocation = locationId;
  selectedRating = 0;


  const location = locations.find(
    item => item.id === locationId
  );


  document.getElementById(
    "modal-location"
  ).textContent = location.name;


  document.getElementById(
    "review-text"
  ).value = "";


  updateStars();


  document.getElementById(
    "review-modal"
  ).classList.add("open");

}


function updateStars() {

  document
    .querySelectorAll(
      "#star-picker button"
    )
    .forEach(button => {

      const rating =
        Number(button.dataset.rating);

      button.classList.toggle(
        "selected",
        rating <= selectedRating
      );

    });

}


document
  .querySelectorAll(
    "#star-picker button"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      function () {

        selectedRating =
          Number(this.dataset.rating);

        updateStars();

      }
    );

  });


document
  .getElementById("cancel-review")
  .addEventListener(
    "click",
    closeReview
  );


function closeReview() {

  document
    .getElementById("review-modal")
    .classList.remove("open");

}


document
  .getElementById("save-review")
  .addEventListener(
    "click",
    function () {

      if (!selectedRating) {

        alert(
          "Please select a star rating."
        );

        return;

      }


      const text =
        document
          .getElementById(
            "review-text"
          )
          .value
          .trim();


      const reviews =
        getReviews(
          currentReviewLocation
        );


      reviews.push({

        rating: selectedRating,

        text: text,

        date:
          new Date()
            .toISOString()

      });


      localStorage.setItem(

        "desiremaps_reviews_" +
        currentReviewLocation,

        JSON.stringify(reviews)

      );


      closeReview();


      const activeButton =
        document.querySelector(
          ".filter-btn.active"
        );


      renderLocations(
        activeButton
          ? activeButton.dataset.filter
          : "all"
      );


      alert(
        "Thank you! Your review has been saved."
      );

    }
  );


document
  .getElementById("review-modal")
  .addEventListener(
    "click",
    function (event) {

      if (event.target === this) {

        closeReview();

      }

    }
  );


renderLocations();


setTimeout(
  () => map.invalidateSize(),
  400
);

</script>

</body>
</html>
